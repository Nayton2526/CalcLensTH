name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable test signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calclens-th-test-signing-v1

      - name: Create stable test signing key
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CalcLens TH Test,O=CalcLens TH,C=TH"

      - name: Bundle PP-FormulaNet tokenizer
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 "https://modelscope.cn/models/greatv/oar-ocr/resolve/master/pp-formulanet-tokenizer.json" -o app/src/main/assets/models/pp-formulanet-tokenizer.json
          echo "2811d82701ec97c192fa256aa2b4516929373870ae660326cc5b1dc879b95ff2  app/src/main/assets/models/pp-formulanet-tokenizer.json" | sha256sum -c -

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CalcLensTH-V0.4.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
